<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d6f76b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff6b6b"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#111111"/>
  <text x="60" y="110" fill="#a3a3a3" font-size="26" letter-spacing="4">FINAL YEAR PROJECT · PIPELINE</text>
  <text x="60" y="160" fill="#f5f5f5" font-size="44" font-weight="700">Three-layer defense against harmful prompts</text>

  <rect x="60" y="380" width="200" height="170" rx="20" fill="#272727" stroke="#353535" stroke-width="2"/>
  <text x="85" y="455" fill="#f5f5f5" font-size="30" font-weight="700">User</text>
  <text x="85" y="495" fill="#f5f5f5" font-size="30" font-weight="700">prompt</text>

  <g fill="#272727" stroke="#d6f76b" stroke-width="2">
    <rect x="320" y="340" width="280" height="250" rx="22"/>
    <rect x="660" y="340" width="280" height="250" rx="22"/>
    <rect x="1000" y="340" width="280" height="250" rx="22"/>
  </g>
  <g fill="#d6f76b" font-size="22" letter-spacing="3">
    <text x="345" y="390">LAYER 1</text>
    <text x="685" y="390">LAYER 2</text>
    <text x="1025" y="390">LAYER 3</text>
  </g>
  <g fill="#f5f5f5" font-size="30" font-weight="700">
    <text x="345" y="445">Intent</text><text x="345" y="485">classifier</text>
    <text x="685" y="445">Fine-tuned</text><text x="685" y="485">TinyLlama</text>
    <text x="1025" y="445">Zero-shot</text><text x="1025" y="485">validator</text>
  </g>
  <g fill="#a3a3a3" font-size="22">
    <text x="345" y="550">DistilBERT</text>
    <text x="685" y="550">QLoRA</text>
    <text x="1025" y="550">Final check</text>
  </g>

  <rect x="1340" y="380" width="200" height="170" rx="20" fill="#d6f76b"/>
  <text x="1365" y="455" fill="#1c1c1c" font-size="30" font-weight="700">Safe</text>
  <text x="1365" y="495" fill="#1c1c1c" font-size="30" font-weight="700">response</text>

  <g stroke="#d6f76b" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M260 465 L315 465"/>
    <path d="M600 465 L655 465"/>
    <path d="M940 465 L995 465"/>
    <path d="M1280 465 L1335 465"/>
  </g>

  <rect x="320" y="740" width="960" height="110" rx="20" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="350" y="808" fill="#ff6b6b" font-size="30" font-weight="700">Blocked: any layer can flag the prompt as harmful</text>
  <g stroke="#ff6b6b" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#r)">
    <path d="M460 590 L460 735"/>
    <path d="M800 590 L800 735"/>
    <path d="M1140 590 L1140 735"/>
  </g>
  <text x="60" y="935" fill="#a3a3a3" font-size="22">Small models, deployed as a public demo on Hugging Face Spaces</text>
</svg>
